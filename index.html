<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='40' fill='%234da3ff'/%3E%3Ccircle cx='50' cy='50' r='22' fill='%23bfe7ff'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0a0e1a" />
    <title>Core Defense</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
      <div id="hud">
        <div class="hud-stat">
          <span class="hud-label">Núcleo</span>
          <div class="hp-bar"><div id="core-hp-fill" class="hp-fill"></div></div>
        </div>
        <div class="hud-stat wave-badge">
          <span class="hud-label">Onda</span>
          <span id="wave-number" class="hud-value">1</span>
          <span id="wave-status" class="hud-sub"></span>
        </div>
        <div class="hud-stat hud-right">
          <span class="hud-label">Abates</span>
          <span id="kills" class="hud-value">0</span>
        </div>
      </div>
      <div id="game-over" class="hidden">
        <h1>Núcleo destruído</h1>
        <p><span id="final-kills">0</span> inimigos abatidos — onda <span id="final-wave">1</span></p>
        <button id="restart">Reiniciar</button>
      </div>
      <div id="upgrade-panel">
        <div class="upgrade-chip">
          <button class="upgrade-btn" id="btn-damage-minus" aria-label="Diminuir ataque">−</button>
          <span class="upgrade-info">
            <span class="upgrade-label">Ataque</span>
            <span id="stat-damage" class="upgrade-value">10</span>
          </span>
          <button class="upgrade-btn" id="btn-damage-plus" aria-label="Aumentar ataque">+</button>
        </div>
        <div class="upgrade-chip">
          <button class="upgrade-btn" id="btn-firerate-minus" aria-label="Diminuir cadência">−</button>
          <span class="upgrade-info">
            <span class="upgrade-label">Cadência</span>
            <span id="stat-firerate" class="upgrade-value">2.2/s</span>
          </span>
          <button class="upgrade-btn" id="btn-firerate-plus" aria-label="Aumentar cadência">+</button>
        </div>
        <div class="upgrade-chip">
          <button class="upgrade-btn" id="btn-range-minus" aria-label="Diminuir alcance">−</button>
          <span class="upgrade-info">
            <span class="upgrade-label">Alcance</span>
            <span id="stat-range" class="upgrade-value">320</span>
          </span>
          <button class="upgrade-btn" id="btn-range-plus" aria-label="Aumentar alcance">+</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
